services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://msguser:msgpass@db:5432/mensagens
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mensagens
      POSTGRES_USER: msguser
      POSTGRES_PASSWORD: msgpass
    volumes:
      - msg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msguser -d mensagens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  msg_data:
